name: Python lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Lint Python source
        run: |
          python -m flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Check Python style
        run: |
          python -m flake8 . \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics
